<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Прокат</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1e2a3a">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; }
  body { padding-bottom: 130px; }
  header { position: sticky; top: 0; z-index: 10; background: #1e2a3a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); gap: 8px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .user { font-size: 13px; opacity: .8; }
  header button { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .hdr-left { display: flex; align-items: center; gap: 4px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e3e6ea; display: flex; z-index: 10; }
  nav button { flex: 1; padding: 12px 0; border: none; background: none; font-size: 12px; color: #666; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button.active { color: #2563eb; font-weight: 600; }
  nav button .ic { font-size: 20px; }
  .back-float { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: #1e2a3a; color: #fff; border: none; padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 11; display: flex; align-items: center; gap: 6px; }
  .back-float:active { opacity: .8; }
  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .sub { color: #666; font-size: 13px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.green { background: #16a34a; box-shadow: 0 0 6px rgba(22,163,74,.4); }
  .dot.red { background: #dc2626; box-shadow: 0 0 6px rgba(220,38,38,.4); }
  .dot.blue { background: #2563eb; box-shadow: 0 0 6px rgba(37,99,235,.4); }
  .tech-name-row { display: flex; align-items: center; gap: 8px; }
  .tech-name-row h3 { margin: 0; }
  .cat-card { display: flex; align-items: center; justify-content: space-between; }
  .cat-card .count { color: #888; font-size: 13px; }
  .num-badge { display: inline-block; background: #1e2a3a; color: #fff; font-size: 12px; padding: 3px 9px; border-radius: 6px; margin-right: 6px; font-weight: 600; }
  .num-badge.zero { background: #d1d5db; color: #6b7280; }
  .num-badge.ordered { background: #f59e0b; }
  .btn { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn.secondary { background: #e5e7eb; color: #1a1a1a; }
  .btn.danger { background: #dc2626; }
  .btn.success { background: #16a34a; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn:active { opacity: .8; }
  .fab { position: fixed; right: 16px; bottom: 140px; width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff; border: none; font-size: 28px; line-height: 1; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,.4); }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .login-box h2 { margin: 0 0 16px; text-align: center; }
  .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  .login-box .btn { width: 100%; margin-top: 6px; padding: 12px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; min-height: 18px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-bg.nested { background: rgba(0,0,0,.4); z-index: 200; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 14px; }
  .modal label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .modal-actions .btn { flex: 1; min-width: 100px; }
  .log-item { padding: 10px 12px; border-bottom: 1px solid #eef0f2; font-size: 14px; }
  .log-item:last-child { border-bottom: none; }
  .log-item .time { color: #888; font-size: 12px; }
  .log-item .who { color: #2563eb; font-weight: 500; }
  .empty { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
  .search { width: 100%; padding: 10px 14px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  .cat-list { max-height: 180px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px; margin-top: 4px; }
  .cat-item { padding: 6px 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 6px; justify-content: space-between; }
  .cat-item:hover { background: #f3f4f6; }
  .cat-item .cat-label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
  .cat-item input { width: auto; }
  .qty-row { display: flex; align-items: center; gap: 8px; }
  .qty-row input { flex: 1; }
  .qty-row .btn { padding: 8px 14px; font-size: 18px; line-height: 1; }
  .inst-item { padding: 10px 12px; border-bottom: 1px solid #eef0f2; font-size: 13px; }
  .inst-item:last-child { border-bottom: none; }
  .inst-item .info { flex: 1; }
  .link-item { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .link-item a { flex: 1; color: #2563eb; text-decoration: none; font-size: 14px; padding: 8px 10px; background: #f3f4f6; border-radius: 6px; display: flex; justify-content: space-between; }
  .tabs-top { display: flex; gap: 8px; margin-bottom: 12px; background: #fff; padding: 4px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .tab-top { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; }
  .tab-top.active { background: #2563eb; color: #fff; }
  .order-row { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eef0f2; font-size: 13px; }
  .order-row:last-child { border-bottom: none; }
  .order-row .info { flex: 1; }
  .order-row .price { text-align: right; white-space: nowrap; font-weight: 600; }
  .order-row .price .sub { font-weight: 400; font-size: 12px; color: #888; }
  .total-box { padding: 14px; background: #fff; border-radius: 10px; margin-top: 12px; font-size: 14px; display: flex; justify-content: space-between; font-weight: 600; }
  .filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-row .cat-chip { font-size: 13px; padding: 6px 12px; }
  .cat-chip { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; background: #fff; border: 1px solid #d1d5db; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .cat-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .radio-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .radio-opt { flex: 1; padding: 10px; text-align: center; border: 2px solid #d1d5db; border-radius: 8px; cursor: pointer; font-size: 13px; background: #fff; }
  .radio-opt.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; font-weight: 600; }
  .fixed-cat { padding: 10px 12px; background: #f3f4f6; border-radius: 8px; font-size: 13px; color: #555; margin-top: 4px; }
  .fixed-cat strong { color: #1a1a1a; }
  .cat-view { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f3f4f6; border-radius: 8px; margin-top: 4px; font-size: 13px; }
  .cat-view .val { color: #1a1a1a; flex: 1; }
  .status-picker { display: flex; gap: 8px; margin-top: 6px; }
  .status-opt { flex: 1; padding: 12px; text-align: center; border: 2px solid #d1d5db; border-radius: 8px; cursor: pointer; font-size: 14px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .status-opt.active { border-color: #2563eb; background: #eff6ff; }
  .repair-card { padding: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .repair-card .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .repair-card .status-lbl { font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
  .repair-card .status-lbl.progress { background: #dbeafe; color: #1d4ed8; }
  .repair-card .status-lbl.done { background: #dcfce7; color: #166534; }
  .repair-card .comment { color: #333; margin: 6px 0; white-space: pre-wrap; }
  .repair-card .parts-list { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e5e7eb; }
  .repair-card .part-line { display: flex; justify-content: space-between; font-size: 12px; color: #555; padding: 2px 0; }
  .repair-card .meta { color: #888; font-size: 11px; margin-top: 6px; }
  .repair-card .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .repair-part-item { padding: 8px 10px; background: #f9fafb; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
  .repair-part-item .t { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .repair-part-item .t.installed { background: #dcfce7; color: #166534; }
  .repair-part-item .t.ordered { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-box">
    <h2>🔧 Прокат</h2>
    <input id="loginInput" placeholder="Логин" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="loginBtn">Войти</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="hdr-left">
      <div>
        <h1 id="pageTitle">Гараж</h1>
        <div class="user" id="userLabel"></div>
      </div>
    </div>
    <button id="logoutBtn">Выйти</button>
  </header>
  <main id="content"></main>
  <button class="back-float" id="backBtn" style="display:none">← Назад</button>
  <button class="fab" id="addBtn" style="display:none">+</button>
  <nav>
    <button data-view="garage" class="active"><span class="ic">🚜</span><span>Гараж</span></button>
    <button data-view="warehouse"><span class="ic">📦</span><span>Склад</span></button>
    <button data-view="logs"><span class="ic">📋</span><span>Логи</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="modalRoot2"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://mieypqtkrsbtujbtlgey.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gLuUMy49IZEgkFRjk6qMeQ_wt3cMJWG';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const state = {
  view: 'garage',
  garageCat: null,
  whCat: null,
  whTab: 'parts',
  emp: null,
  techs: [], parts: [], categories: [], links: [], repairs: [], repairParts: [], orders: [], tools: [], logs: [],
  search: '', orderFilter: 'all'
};
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

async function sha256(t) { const b = new TextEncoder().encode(t); const h = await crypto.subtle.digest('SHA-256', b); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); }
function fmtDay(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function money(n) { return (Math.round(n||0)).toLocaleString('ru-RU') + ' ₽'; }

async function addLog(action, description, entity_type = null, entity_id = null) {
  if (!state.emp) return;
  await sb.from('logs').insert({ employee_id: state.emp.id, employee_name: state.emp.name, action, description, entity_type, entity_id });
}

async function tryLogin() {
  const login = $('#loginInput').value.trim().toLowerCase();
  const pass  = $('#passwordInput').value;
  $('#loginErr').textContent = '';
  if (!login || !pass) { $('#loginErr').textContent = 'Введите логин и пароль'; return; }
  const hash = await sha256(pass);
  const { data, error } = await sb.from('employees').select('id, login, name, role, password_hash').eq('login', login).maybeSingle();
  if (error) { $('#loginErr').textContent = 'Ошибка: ' + error.message; return; }
  if (!data) { $('#loginErr').textContent = 'Пользователь не найден'; return; }
  if (data.password_hash !== hash) { $('#loginErr').textContent = 'Неверный пароль'; return; }
  const emp = { id: data.id, login: data.login, name: data.name, role: data.role };
  localStorage.setItem('rental_employee', JSON.stringify(emp));
  state.emp = emp;
  await startApp();
}
function logout() {
  localStorage.removeItem('rental_employee');
  state.emp = null;
  $('#app').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
  $('#loginInput').value = '';
  $('#passwordInput').value = '';
}

async function loadAll() {
  const [techs, parts, cats, links, repairs, repairParts, orders, tools, logs] = await Promise.all([
    sb.from('techs').select('*').order('name'),
    sb.from('parts').select('*').order('name'),
    sb.from('categories').select('*').order('name'),
    sb.from('part_links').select('*'),
    sb.from('repairs').select('*').order('created_at', {ascending:false}),
    sb.from('repair_parts').select('*'),
    sb.from('orders').select('*').order('ordered_at', {ascending:false}),
    sb.from('tools').select('*').order('purchase_date', {ascending:false}),
    sb.from('logs').select('*').order('created_at', {ascending:false}).limit(300)
  ]);
  state.techs = techs.data || [];
  state.parts = parts.data || [];
  state.categories = cats.data || [];
  state.links = links.data || [];
  state.repairs = repairs.data || [];
  state.repairParts = repairParts.data || [];
  state.orders = orders.data || [];
  state.tools = tools.data || [];
  state.logs = logs.data || [];
}

function techHasActiveRepair(techId) {
  return state.repairs.some(r => r.tech_id === techId && r.status === 'in_progress');
}
function techStatus(tech) {
  return techHasActiveRepair(tech.id) ? 'repair' : 'free';
}

function render() {
  const titles = {garage:'Гараж', warehouse:'Склад', logs:'Логи'};
  let title = titles[state.view];
  if (state.view === 'garage' && state.garageCat) { const c = state.categories.find(x => x.id === state.garageCat); title = c ? c.name : 'Гараж'; }
  if (state.view === 'warehouse' && state.whCat) {
    if (state.whCat === '__none__') title = 'Универсальные';
    else { const c = state.categories.find(x => x.id === state.whCat); title = c ? c.name : 'Склад'; }
  }
  $('#pageTitle').textContent = title;

  const showBack = (state.view === 'garage' && state.garageCat) || (state.view === 'warehouse' && state.whCat && state.whTab === 'parts');
  $('#backBtn').style.display = showBack ? 'flex' : 'none';

  $('#userLabel').textContent = state.emp.name;

  let showFab = false;
  if (state.view === 'garage') showFab = true;
  else if (state.view === 'warehouse' && state.whTab === 'parts' && state.whCat) showFab = true;
  else if (state.view === 'warehouse' && state.whTab === 'tools') showFab = true;
  $('#addBtn').style.display = showFab ? 'block' : 'none';

  $$('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));

  if (state.view === 'garage') renderGarage();
  else if (state.view === 'warehouse') renderWarehouse();
  else if (state.view === 'logs') renderLogs();
}

function renderGarage() {
  if (!state.garageCat) renderGarageCategories();
  else renderGarageTechs();
}

function renderGarageCategories() {
  const q = state.search.toLowerCase();
  const cats = state.categories.filter(c => !q || c.name.toLowerCase().includes(q));
  const noCatCount = state.techs.filter(t => !t.category_id).length;

  let html = `<input class="search" id="searchInput" placeholder="Поиск категорий..." value="${esc(state.search)}">`;
  if (!cats.length && !noCatCount) {
    html += `<div class="empty">Пока нет категорий.<br>Нажми «+» чтобы создать.</div>`;
  } else {
    for (const c of cats) {
      const count = state.techs.filter(t => t.category_id === c.id).length;
      html += `<div class="card cat-card" data-cat="${c.id}"><h3>${esc(c.name)}</h3><span class="count">${count} шт</span></div>`;
    }
    if (noCatCount) {
      html += `<div class="card cat-card" data-cat="__none__"><h3 style="color:#888">Без категории</h3><span class="count">${noCatCount} шт</span></div>`;
    }
  }
  $('#content').innerHTML = html;
  const si = $('#searchInput');
  if (si) si.oninput = e => { state.search = e.target.value; const p = e.target.selectionStart; renderGarageCategories(); const ni = $('#searchInput'); if (ni) { ni.focus(); ni.setSelectionRange(p, p); } };
  $$('[data-cat]').forEach(el => el.onclick = () => { state.garageCat = el.dataset.cat === '__none__' ? '__none__' : el.dataset.cat; state.search = ''; render(); });
}

function renderGarageTechs() {
  const q = state.search.toLowerCase();
  let list;
  if (state.garageCat === '__none__') list = state.techs.filter(t => !t.category_id);
  else list = state.techs.filter(t => t.category_id === state.garageCat);
  list = list.filter(t => !q || t.name.toLowerCase().includes(q));
  const order = {repair:0, free:1};
  list.sort((a,b) => (order[techStatus(a)]??9) - (order[techStatus(b)]??9) || a.name.localeCompare(b.name));

  let html = `<input class="search" id="searchInput" placeholder="Поиск техники..." value="${esc(state.search)}">`;
  if (!list.length) {
    html += `<div class="empty">Пока нет техники.<br>Нажми «+» чтобы добавить.</div>`;
  } else {
    for (const t of list) {
      const st = techStatus(t);
      const dot = st === 'repair' ? 'red' : 'green';
      const activeRepairs = state.repairs.filter(r => r.tech_id === t.id).length;
      html += `<div class="card" data-tech="${t.id}">
        <div class="tech-name-row">
          <span class="dot ${dot}"></span>
          <h3>${esc(t.name)}</h3>
        </div>
        ${activeRepairs ? `<div class="sub">Ремонтов: ${activeRepairs}</div>` : ''}
      </div>`;
    }
  }
  $('#content').innerHTML = html;
  const si = $('#searchInput');
  if (si) si.oninput = e => { state.search = e.target.value; const p = e.target.selectionStart; renderGarageTechs(); const ni = $('#searchInput'); if (ni) { ni.focus(); ni.setSelectionRange(p, p); } };
  $$('[data-tech]').forEach(el => el.onclick = () => openTechModal(el.dataset.tech));
}

function renderWarehouse() {
  const tabsHtml = `<div class="tabs-top">
    <div class="tab-top ${state.whTab==='parts'?'active':''}" id="tabParts">📦 Склад</div>
    <div class="tab-top ${state.whTab==='orders'?'active':''}" id="tabOrders">🛒 Заказы</div>
    <div class="tab-top ${state.whTab==='tools'?'active':''}" id="tabTools">🔧 Инструменты</div>
  </div>`;

  if (state.whTab === 'orders') { renderOrders(tabsHtml); return; }
  if (state.whTab === 'tools') { renderTools(tabsHtml); return; }

  // Склад (parts)
  if (!state.whCat) {
    const q = state.search.toLowerCase();
    const cats = state.categories.filter(c => !q || c.name.toLowerCase().includes(q));
    const universalCount = state.parts.filter(p => !p.category_ids || !p.category_ids.length).length;

    let html = tabsHtml;
    html += `<input class="search" id="searchInput" placeholder="Поиск категорий..." value="${esc(state.search)}">`;
    if (!cats.length && !universalCount) {
      html += `<div class="empty">Пока нет категорий.<br>Создай их в гараже.</div>`;
    } else {
      for (const c of cats) {
        const count = state.parts.filter(p => (p.category_ids || []).includes(c.id)).length;
        html += `<div class="card cat-card" data-whcat="${c.id}"><h3>${esc(c.name)}</h3><span class="count">${count} шт</span></div>`;
      }
      if (universalCount) {
        html += `<div class="card cat-card" data-whcat="__none__"><h3 style="color:#888">Универсальные</h3><span class="count">${universalCount} шт</span></div>`;
      }
    }
    $('#content').innerHTML = html;

    $('#tabParts').onclick = () => { state.whTab = 'parts'; render(); };
    $('#tabOrders').onclick = () => { state.whTab = 'orders'; render(); };
    $('#tabTools').onclick = () => { state.whTab = 'tools'; render(); };
    const si = $('#searchInput');
    if (si) si.oninput = e => { state.search = e.target.value; const p = e.target.selectionStart; renderWarehouse(); const ni = $('#searchInput'); if (ni) { ni.focus(); ni.setSelectionRange(p, p); } };
    $$('[data-whcat]').forEach(el => el.onclick = () => { state.whCat = el.dataset.whcat === '__none__' ? '__none__' : el.dataset.whcat; state.search = ''; render(); });
  } else {
    const q = state.search.toLowerCase();
    let list;
    if (state.whCat === '__none__') list = state.parts.filter(p => !p.category_ids || !p.category_ids.length);
    else list = state.parts.filter(p => (p.category_ids || []).includes(state.whCat));
    list = list.filter(p => !q || p.name.toLowerCase().includes(q));

    let html = tabsHtml;
    html += `<input class="search" id="searchInput" placeholder="Поиск запчастей..." value="${esc(state.search)}">`;
    if (!list.length) {
      html += `<div class="empty">Пока нет запчастей.<br>Нажми «+» чтобы добавить.</div>`;
    } else {
      for (const p of list) {
        const hasOrdered = (p.ordered||0) > 0;
        html += `<div class="card" data-part="${p.id}">
          <h3>${esc(p.name)}</h3>
          <div style="margin-top:6px">
            <span class="num-badge ${p.in_stock>0?'':'zero'}">${p.in_stock} шт</span>
            ${hasOrdered ? `<span class="num-badge ordered">заказано: ${p.ordered}</span>` : ''}
            ${p.price_unit ? `<span class="num-badge" style="background:#e5e7eb;color:#374151">${money(p.price_unit)}</span>` : ''}
          </div>
          ${hasOrdered ? `<div style="margin-top:10px"><button class="btn success small" data-pickup="${p.id}">🟢 Забрал</button></div>` : ''}
        </div>`;
      }
    }
    $('#content').innerHTML = html;

    $('#tabParts').onclick = () => { state.whTab = 'parts'; render(); };
    $('#tabOrders').onclick = () => { state.whTab = 'orders'; render(); };
    $('#tabTools').onclick = () => { state.whTab = 'tools'; render(); };
    const si = $('#searchInput');
    if (si) si.oninput = e => { state.search = e.target.value; const pos = e.target.selectionStart; renderWarehouse(); const ni = $('#searchInput'); if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); } };
    $$('[data-part]').forEach(el => el.onclick = (e) => { if (e.target.closest('[data-pickup]')) return; openPartModal(el.dataset.part); });
    $$('[data-pickup]').forEach(el => el.onclick = (e) => { e.stopPropagation(); openPickupDialog(el.dataset.pickup); });
  }
}

function renderTools(tabsHtml) {
  const q = state.search.toLowerCase();
  const list = state.tools.filter(t => !q || t.name.toLowerCase().includes(q));

  let html = tabsHtml;
  html += `<input class="search" id="searchInput" placeholder="Поиск инструментов..." value="${esc(state.search)}">`;

  if (!list.length) {
    html += `<div class="empty">Пока нет инструментов.<br>Нажми «+» чтобы добавить.</div>`;
  } else {
    for (const t of list) {
      html += `<div class="card" data-tool="${t.id}">
        <h3>${esc(t.name)}</h3>
        <div class="sub">Куплен: ${fmtDay(t.purchase_date)}${t.shop ? ' · ' + esc(t.shop) : ''}</div>
        ${t.price ? `<div style="margin-top:6px"><span class="num-badge" style="background:#e5e7eb;color:#374151">${money(t.price)}</span></div>` : ''}
      </div>`;
    }
  }
  $('#content').innerHTML = html;

  $('#tabParts').onclick = () => { state.whTab = 'parts'; render(); };
  $('#tabOrders').onclick = () => { state.whTab = 'orders'; render(); };
  $('#tabTools').onclick = () => { state.whTab = 'tools'; render(); };
  const si = $('#searchInput');
  if (si) si.oninput = e => { state.search = e.target.value; const p = e.target.selectionStart; renderTools(tabsHtml); const ni = $('#searchInput'); if (ni) { ni.focus(); ni.setSelectionRange(p, p); } };
  $$('[data-tool]').forEach(el => el.onclick = () => openToolForm(state.tools.find(t => t.id === el.dataset.tool)));
}

function renderOrders(tabsHtml) {
  const filter = state.orderFilter;
  const now = new Date();
  let list = state.orders;
  if (filter === 'month') {
    const m = now.getMonth(), y = now.getFullYear();
    list = list.filter(o => { const d = new Date(o.ordered_at); return d.getMonth()===m && d.getFullYear()===y; });
  } else if (filter === 'year') {
    list = list.filter(o => new Date(o.ordered_at).getFullYear() === now.getFullYear());
  }

  let html = tabsHtml;
  html += `<div class="filter-row">
    <div class="cat-chip ${filter==='all'?'active':''}" data-of="all">Все</div>
    <div class="cat-chip ${filter==='month'?'active':''}" data-of="month">Этот месяц</div>
    <div class="cat-chip ${filter==='year'?'active':''}" data-of="year">Этот год</div>
  </div>`;

  if (!list.length) {
    html += `<div class="empty">Заказов пока нет.</div>`;
  } else {
    let total = 0;
    for (const o of list) {
      total += o.total || 0;
      const st = o.status === 'bought' ? '🟢 Куплено' : '🟡 Заказано';
      html += `<div class="order-row">
        <div class="info">
          <strong>${esc(o.part_name)}</strong> · ${o.qty} шт
          <div class="sub" style="color:#888;font-size:12px">${esc(o.shop_label || '—')} · ${fmtDate(o.ordered_at)} · ${esc(o.employee_name || '')}${o.bought_at ? `<br>Куплено: ${fmtDate(o.bought_at)}` : ''}</div>
          <div style="margin-top:4px;font-size:12px">${st}</div>
        </div>
        <div class="price">${money(o.total)}<div class="sub">${money(o.price)}/шт</div></div>
      </div>`;
    }
    html += `<div class="total-box"><span>Итого:</span><span>${money(total)}</span></div>`;
  }
  $('#content').innerHTML = html;
  $('#tabParts').onclick = () => { state.whTab = 'parts'; render(); };
  $('#tabOrders').onclick = () => { state.whTab = 'orders'; render(); };
  $('#tabTools').onclick = () => { state.whTab = 'tools'; render(); };
  $$('[data-of]').forEach(el => el.onclick = () => { state.orderFilter = el.dataset.of; renderOrders(tabsHtml); });
}

function renderLogs() {
  if (!state.logs.length) { $('#content').innerHTML = `<div class="empty">Пока нет записей.</div>`; return; }
  let html = '';
  for (const l of state.logs) {
    html += `<div class="log-item"><div><span class="who">${esc(l.employee_name)}</span> — ${esc(l.description)}</div><div class="time">${fmtDate(l.created_at)}</div></div>`;
  }
  $('#content').innerHTML = html;
}

function openModal(title, html, onMount, nested = false) {
  const root = nested ? $('#modalRoot2') : $('#modalRoot');
  const cls = nested ? 'modal-bg nested' : 'modal-bg';
  root.innerHTML = `<div class="${cls}"><div class="modal"><h3>${esc(title)}</h3><div id="modalBody">${html}</div></div></div>`;
  root.querySelector('.modal-bg').onclick = e => { if (e.target.classList.contains('modal-bg')) closeModal(nested); };
  onMount?.();
}
function closeModal(nested = false) {
  if (nested) $('#modalRoot2').innerHTML = '';
  else { $('#modalRoot').innerHTML = ''; $('#modalRoot2').innerHTML = ''; }
}

function openCategoryForm(cat) {
  const isNew = !cat;
  const title = isNew ? 'Новая категория' : 'Категория: ' + cat.name;
  let html = `<label>Название</label><input id="c_name" value="${esc(cat?.name || '')}">`;
  html += `<div class="modal-actions">
    ${!isNew ? '<button class="btn danger" id="delBtn">Удалить</button>' : ''}
    <button class="btn secondary" id="cancelBtn">Отмена</button>
    <button class="btn" id="saveBtn">Сохранить</button></div>`;
  openModal(title, html, () => {
    $('#cancelBtn').onclick = () => closeModal();
    $('#saveBtn').onclick = async () => {
      const name = $('#c_name').value.trim();
      if (!name) { alert('Введи название'); return; }
      if (isNew) {
        const { error } = await sb.from('categories').insert({name});
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('add_category', `Добавил категорию: ${name}`, 'category');
      } else {
        const { error } = await sb.from('categories').update({name}).eq('id', cat.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('edit_category', `Изменил категорию: ${name}`, 'category', cat.id);
      }
      await loadAll(); render(); closeModal();
    };
    if (!isNew) {
      $('#delBtn').onclick = async () => {
        const usedByTechs = state.techs.filter(t => t.category_id === cat.id);
        const usedByParts = state.parts.filter(p => (p.category_ids || []).includes(cat.id));
        if (usedByTechs.length || usedByParts.length) {
          const msgs = [];
          if (usedByTechs.length) msgs.push(`техники: ${usedByTechs.map(t => t.name).join(', ')}`);
          if (usedByParts.length) msgs.push(`запчастей: ${usedByParts.map(p => p.name).join(', ')}`);
          alert('Нельзя удалить категорию — она используется:\n' + msgs.join('\n'));
          return;
        }
        if (!confirm(`Удалить категорию «${cat.name}»?`)) return;
        const { error } = await sb.from('categories').delete().eq('id', cat.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('del_category', `Удалил категорию: ${cat.name}`, 'category', cat.id);
        await loadAll(); render(); closeModal();
      };
    }
  });
}

function addTech() { openTechForm(null); }
function openTechModal(id) { openTechForm(state.techs.find(t => t.id === id)); }

function openTechForm(t) {
  const isNew = !t;
  const title = isNew ? 'Новая техника' : 'Техника: ' + t.name;
  const presetCat = isNew && state.garageCat && state.garageCat !== '__none__' ? state.garageCat : (t?.category_id || '');

  let html = `
    <label>Название</label><input id="f_name" value="${esc(t?.name || '')}" placeholder="Например: Снегоход Буран синий">
    <label>Категория</label>
    <select id="f_category">
      <option value="">— Без категории —</option>
      ${state.categories.map(c => `<option value="${c.id}" ${presetCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select>
    <label>Заметки</label><textarea id="f_notes">${esc(t?.notes || '')}</textarea>`;

  if (!isNew) {
    const st = techStatus(t);
    const stLabel = st === 'repair' ? '🔴 В ремонте' : '🟢 На ходу';
    html += `<div style="margin-top:14px;padding:10px 12px;background:#f3f4f6;border-radius:8px;font-size:13px">Статус: <strong>${stLabel}</strong> <span style="color:#888;font-size:11px">(автоматически)</span></div>`;

    html += `<div style="margin-top:18px;border-top:1px solid #e5e7eb;padding-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px">
        <strong>Ремонты</strong>
        <button class="btn small" id="addRepairBtn">+ Добавить ремонт</button>
      </div>
      <div id="repairsList"></div>
    </div>`;
  }
  html += `<div class="modal-actions">
    ${!isNew ? '<button class="btn danger" id="delBtn">Удалить</button>' : ''}
    <button class="btn secondary" id="cancelBtn">Отмена</button>
    <button class="btn" id="saveBtn">Сохранить</button></div>`;
  openModal(title, html, () => {
    $('#cancelBtn').onclick = () => closeModal();
    $('#saveBtn').onclick = async () => {
      const obj = { name: $('#f_name').value.trim(), category_id: $('#f_category').value || null, notes: $('#f_notes').value.trim() };
      if (!obj.name) { alert('Введи название'); return; }
      if (isNew) {
        const { data, error } = await sb.from('techs').insert(obj).select().single();
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('add_tech', `Добавил технику: ${obj.name}`, 'tech', data.id);
      } else {
        const { error } = await sb.from('techs').update(obj).eq('id', t.id);
        if (error) { alert('Ошибка: ' + error.message); return; }

      }
      await loadAll(); render(); closeModal();
    };
    if (!isNew) {
      $('#delBtn').onclick = async () => {
        if (!confirm('Удалить технику? Все ремонты тоже удалятся.')) return;
        const { error } = await sb.from('techs').delete().eq('id', t.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('del_tech', `Удалил технику: ${t.name}`, 'tech', t.id);

      };
      $('#addRepairBtn').onclick = () => openRepairForm(t, null);
      renderRepairsList(t.id);

}

function renderRepairsList(techId) {
  const box = $('#repairsList');
  if (!box) return;
  const list = state.repairs.filter(r => r.tech_id === techId);
  if (!list.length) { box.innerHTML = `<div class="sub" style="color:#999">Пока нет ремонтов</div>`; return; }
  box.innerHTML = list.map(r => renderRepairCard(r)).join('');
  box.querySelectorAll('[data-edit-repair]').forEach(btn => btn.onclick = () => {
    const tech = state.techs.find(t => t.id === techId);
    openRepairForm(tech, state.repairs.find(x => x.id === btn.dataset.editRepair));
  });
}

function renderRepairCard(r) {
  const parts = state.repairParts.filter(rp => rp.repair_id === r.id);
  const stLabel = r.status === 'completed' ? '🟢 Завершено' : '🔵 В процессе';
  const stClass = r.status === 'completed' ? 'done' : 'progress';
  const partsHtml = parts.length ? `<div class="parts-list">${parts.map(p => `<div class="part-line"><span>• ${esc(p.part_name)} × ${p.qty}<span class="t ${p.type}">${p.type === 'installed' ? 'установлено' : 'заказано'}</span></span></div>`).join('')}</div>` : '';
  const commentHtml = r.comment ? `<div class="comment">${esc(r.comment)}</div>` : '';
  return `<div class="repair-card">
    <div class="hdr">
      <span class="status-lbl ${stClass}">${stLabel}</span>
      <span style="color:#888;font-size:11px">${fmtDate(r.created_at)}</span>
    </div>
    ${commentHtml}
    ${partsHtml}
    <div class="meta">${esc(r.employee_name)}${r.completed_at ? ` · завершён ${fmtDate(r.completed_at)}` : ''}</div>
    <div class="actions">
      <button class="btn small secondary" data-edit-repair="${r.id}">Открыть</button>
    </div>
  </div>`;
}

function openRepairForm(tech, repair) {
  const isNew = !repair;
  const title = isNew ? 'Новый ремонт: ' + tech.name : 'Ремонт: ' + tech.name;
  const curStatus = repair?.status || 'in_progress';

  let html = `
    <label>Что делал</label>
    <textarea id="r_comment" placeholder="Опиши, что было сделано">${esc(repair?.comment || '')}</textarea>

    <label>Запчасти в ремонте</label>
    <div id="r_parts"></div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <button class="btn small" id="r_installBtn">+ Установить со склада</button>
      <button class="btn small secondary" id="r_orderBtn">+ Заказать запчасть</button>
    </div>

    <label>Статус</label>
    <div class="status-picker">
      <div class="status-opt ${curStatus==='in_progress'?'active':''}" data-rs="in_progress"><span class="dot blue"></span> В процессе</div>
      <div class="status-opt ${curStatus==='completed'?'active':''}" data-rs="completed"><span class="dot green"></span> Завершено</div>
    </div>
  `;

  html += `<div class="modal-actions">
    ${!isNew ? '<button class="btn danger" id="r_delBtn">Удалить ремонт</button>' : ''}
    <button class="btn secondary" id="r_cancel">Отмена</button>
    <button class="btn" id="r_save">Сохранить</button>
  </div>`;

  let tempParts = [];
  if (repair?.id) tempParts = state.repairParts.filter(rp => rp.repair_id === repair.id).map(rp => ({...rp}));

  openModal(title, html, () => {
    let st = curStatus;

    const renderParts = () => {
      const box = $('#r_parts');
      if (!box) return;
      if (!tempParts.length) { box.innerHTML = `<div class="sub" style="color:#999;font-size:12px">Пока нет запчастей</div>`; return; }
      box.innerHTML = tempParts.map((p, i) => `<div class="repair-part-item">
        <span>${esc(p.part_name)} × ${p.qty}<span class="t ${p.type}">${p.type === 'installed' ? 'установлено' : 'заказано'}</span></span>
        <button class="btn small danger" data-rm="${i}" style="padding:2px 8px;font-size:12px">×</button>
      </div>`).join('');
      box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
        tempParts.splice(+b.dataset.rm, 1);
        renderParts();
      });
    };
    renderParts();

    $$('.status-opt').forEach(el => el.onclick = () => {
      st = el.dataset.rs;
      $$('.status-opt').forEach(x => x.classList.toggle('active', x === el));
    });

    $('#r_installBtn').onclick = () => openRepairAddPart(tech, (added) => {
      tempParts.push(added);
      renderParts();
    });
    $('#r_orderBtn').onclick = () => openRepairOrderPart(tech, (added) => {
      tempParts.push(added);
      renderParts();
    });

    $('#r_cancel').onclick = () => closeModal();

    if (!isNew) {
      $('#r_delBtn').onclick = async () => {
        if (!confirm('Удалить ремонт? Установленные запчасти вернутся на склад.')) return;
        const parts = state.repairParts.filter(rp => rp.repair_id === repair.id && rp.type === 'installed');
        for (const rp of parts) {
          const p = state.parts.find(x => x.id === rp.part_id);
          if (p) await sb.from('parts').update({in_stock: (p.in_stock||0) + rp.qty}).eq('id', p.id);
        }
        await sb.from('repairs').delete().eq('id', repair.id);
        await addLog('del_repair', `Удалил ремонт техники «${tech.name}»`, 'tech', tech.id);
        await loadAll(); render();
        closeModal();
        openTechModal(tech.id);
      };
    }

    $('#r_save').onclick = async () => {
      const comment = $('#r_comment').value.trim();

      if (isNew) {
        const { data: newRepair, error } = await sb.from('repairs').insert({
          tech_id: tech.id, comment, status: st,
          employee_id: state.emp.id, employee_name: state.emp.name,
          completed_at: st === 'completed' ? new Date().toISOString() : null
        }).select().single();
        if (error) { alert('Ошибка: ' + error.message); return; }

        for (const p of tempParts) {
          await sb.from('repair_parts').insert({
            repair_id: newRepair.id, part_id: p.part_id, part_name: p.part_name,
            qty: p.qty, type: p.type, order_id: p.order_id || null,
            employee_id: state.emp.id, employee_name: state.emp.name
          });
        }
        await addLog('add_repair', `Создал ремонт техники «${tech.name}»`, 'tech', tech.id);
      } else {
        const oldParts = state.repairParts.filter(rp => rp.repair_id === repair.id);
        const newIds = tempParts.filter(x => x.id).map(x => x.id);
        for (const op of oldParts) {
          if (!newIds.includes(op.id)) {
            if (op.type === 'installed') {
              const p = state.parts.find(x => x.id === op.part_id);
              if (p) await sb.from('parts').update({in_stock: (p.in_stock||0) + op.qty}).eq('id', p.id);
            }
            await sb.from('repair_parts').delete().eq('id', op.id);
          }
        }
        const { error } = await sb.from('repairs').update({
          comment, status: st,
          completed_at: st === 'completed' ? new Date().toISOString() : null
        }).eq('id', repair.id);
        if (error) { alert('Ошибка: ' + error.message); return; }

        for (const p of tempParts) {
          if (!p.id) {
            await sb.from('repair_parts').insert({
              repair_id: repair.id, part_id: p.part_id, part_name: p.part_name,
              qty: p.qty, type: p.type, order_id: p.order_id || null,
              employee_id: state.emp.id, employee_name: state.emp.name
            });
          }
        }
        await addLog('edit_repair', `Изменил ремонт техники «${tech.name}»`, 'tech', tech.id);
      }

      await loadAll(); render();
      closeModal();
      openTechModal(tech.id);
    };
  });
}

function openRepairAddPart(tech, onAdd) {
  const list = state.parts.filter(p => {
    if ((p.in_stock||0) <= 0) return false;
    if (!p.category_ids || !p.category_ids.length) return true;
    if (!tech.category_id) return false;
    return p.category_ids.includes(tech.category_id);
  });

  let html = '';
  if (!list.length) {
    html = `<div class="empty">Нет подходящих запчастей в наличии.</div>`;
  } else {
    html = `<label>Запчасть</label>
      <select id="ra_part">${list.map(p => `<option value="${p.id}">${esc(p.name)} (${p.in_stock} шт)</option>`).join('')}</select>
      <label>Количество</label>
      <div class="qty-row">
        <button class="btn secondary" id="raMinus">−</button>
        <input id="ra_qty" type="number" value="1" min="1">
        <button class="btn secondary" id="raPlus">+</button>
      </div>`;
  }
  html += `<div class="modal-actions">
    <button class="btn secondary" id="raCancel">Отмена</button>
    ${list.length ? '<button class="btn" id="raDo">Добавить</button>' : ''}
  </div>`;

  openModal('Установить запчасть', html, () => {
    $('#raCancel').onclick = () => closeModal(true);
    if (list.length) {
      $('#raMinus').onclick = () => { const i = $('#ra_qty'); i.value = Math.max(1, (+i.value||1) - 1); };
      $('#raPlus').onclick  = () => { const i = $('#ra_qty'); i.value = (+i.value||1) + 1; };
      $('#raDo').onclick = async () => {
        const partId = $('#ra_part').value;
        const qty = Math.max(1, parseInt($('#ra_qty').value) || 1);
        const part = state.parts.find(p => p.id === partId);
        if (!part) return;
        if (qty > (part.in_stock||0)) { alert('Недостаточно на складе'); return; }
        await sb.from('parts').update({in_stock: (part.in_stock||0) - qty}).eq('id', part.id);
        part.in_stock = (part.in_stock||0) - qty;
        onAdd({ part_id: part.id, part_name: part.name, qty, type: 'installed' });
        closeModal(true);
      };
    }
  }, true);
}

function openRepairOrderPart(tech, onAdd) {
  const catName = tech.category_id ? (state.categories.find(c => c.id === tech.category_id)?.name || '') : '';

  let html = `<div class="radio-row">
    <div class="radio-opt active" id="roNew">Создать новую</div>
    <div class="radio-opt" id="roPick">Выбрать со склада</div>
  </div>
  <div id="roNewBlock">
    <label>Название</label><input id="ro_name" placeholder="Например, Ремень вариатора">
    <label>Количество</label>
    <div class="qty-row">
      <button class="btn secondary" id="roMinus">−</button>
      <input id="ro_qty" type="number" value="1" min="1">
      <button class="btn secondary" id="roPlus">+</button>
    </div>
    <label>Цена за штуку, ₽</label><input id="ro_price" type="number" min="0" value="0">
    <label>Магазин</label><input id="ro_shop" placeholder="Ozon">
    ${catName ? `<div class="fixed-cat">Категория: <strong>${esc(catName)}</strong></div>` : '<div class="fixed-cat">Без категории</div>'}
  </div>
  <div id="roPickBlock" style="display:none">
    <label>Выберите запчасть со склада</label>
    <div id="roPickList"></div>
    <div id="roPickForm" style="display:none">
      <label>Количество</label>
      <div class="qty-row">
        <button class="btn secondary" id="ropMinus">−</button>
        <input id="rop_qty" type="number" value="1" min="1">
        <button class="btn secondary" id="ropPlus">+</button>
      </div>
      <label>Цена за штуку, ₽</label><input id="rop_price" type="number" min="0" value="0">
      <label>Магазин</label><input id="rop_shop" placeholder="Ozon">
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn secondary" id="roCancel">Отмена</button>
    <button class="btn" id="roDo">Заказать</button>
  </div>`;

  openModal('Заказать запчасть', html, () => {
    let mode = 'new';
    let picked = null;

    const setMode = (m) => {
      mode = m;
      $('#roNew').classList.toggle('active', m === 'new');
      $('#roPick').classList.toggle('active', m === 'pick');
      $('#roNewBlock').style.display = m === 'new' ? 'block' : 'none';
      $('#roPickBlock').style.display = m === 'pick' ? 'block' : 'none';
    };
    $('#roNew').onclick = () => setMode('new');
    $('#roPick').onclick = () => setMode('pick');

    const bindQty = (m,p,i) => {
      $(m).onclick = () => { const el = $(i); el.value = Math.max(1, (+el.value||1) - 1); };
      $(p).onclick = () => { const el = $(i); el.value = (+el.value||1) + 1; };
    };
    bindQty('#roMinus', '#roPlus', '#ro_qty');
    bindQty('#ropMinus', '#ropPlus', '#rop_qty');

    const partsList = state.parts.filter(p => {
      if (tech.category_id) {
        if (!p.category_ids || !p.category_ids.length) return true;
        return p.category_ids.includes(tech.category_id);
      }
      return true;
    });

    if (partsList.length) {
      $('#roPickList').innerHTML = partsList.map(p => `<div class="cat-item" data-ropick="${p.id}" style="cursor:pointer;padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:6px">
        <div><div><strong>${esc(p.name)}</strong></div><div class="sub" style="font-size:12px;color:#888">В наличии: ${p.in_stock} шт</div></div>
      </div>`).join('');
      $$('[data-ropick]').forEach(el => el.onclick = () => {
        picked = state.parts.find(p => p.id === el.dataset.ropick);
        $$('[data-ropick]').forEach(x => x.style.background = '');
        el.style.background = '#eff6ff';
        $('#roPickForm').style.display = 'block';
        $('#rop_price').value = picked.price_unit || 0;
      });
    } else {
      $('#roPickList').innerHTML = `<div class="sub" style="color:#999">Нет запчастей</div>`;
    }

    $('#roCancel').onclick = () => closeModal(true);
    $('#roDo').onclick = async () => {
      if (mode === 'new') {
        const name = $('#ro_name').value.trim();
        if (!name) { alert('Введи название'); return; }
        const qty = Math.max(1, parseInt($('#ro_qty').value) || 1);
        const price = Math.max(0, parseInt($('#ro_price').value) || 0);
        const shop = $('#ro_shop').value.trim();

        const catIds = tech.category_id ? [tech.category_id] : [];
        const { data: newPart, error: e1 } = await sb.from('parts').insert({
          name, in_stock: 0, ordered: qty, price_unit: price, notes: '', category_ids: catIds
        }).select().single();
        if (e1) { alert('Ошибка: ' + e1.message); return; }

        const { data: order, error: e2 } = await sb.from('orders').insert({
          part_id: newPart.id, part_name: name,
          shop_label: shop, shop_url: '',
          qty, price, total: qty * price,
          status: 'ordered',
          employee_id: state.emp.id, employee_name: state.emp.name
        }).select().single();
        if (e2) { alert('Ошибка заказа: ' + e2.message); return; }

        await addLog('order', `Заказал «${name}» (${qty} шт × ${money(price)}) для ремонта техники «${tech.name}»`, 'tech', tech.id);
        state.parts.push(newPart);
        onAdd({ part_id: newPart.id, part_name: name, qty, type: 'ordered', order_id: order.id });
      } else {
        if (!picked) { alert('Выбери запчасть'); return; }
        const qty = Math.max(1, parseInt($('#rop_qty').value) || 1);
        const price = Math.max(0, parseInt($('#rop_price').value) || 0);
        const shop = $('#rop_shop').value.trim();

        const { data: order, error } = await sb.from('orders').insert({
          part_id: picked.id, part_name: picked.name,
          shop_label: shop, shop_url: '',
          qty, price, total: qty * price,
          status: 'ordered',
          employee_id: state.emp.id, employee_name: state.emp.name
        }).select().single();
        if (error) { alert('Ошибка: ' + error.message); return; }

        await sb.from('parts').update({ordered: (picked.ordered||0) + qty, price_unit: price}).eq('id', picked.id);
        picked.ordered = (picked.ordered||0) + qty;
        await addLog('order', `Заказал «${picked.name}» (${qty} шт × ${money(price)}) для ремонта техники «${tech.name}»`, 'tech', tech.id);
        onAdd({ part_id: picked.id, part_name: picked.name, qty, type: 'ordered', order_id: order.id });
      }
      closeModal(true);
    };
  }, true);
}

function addPart() { openPartForm(null); }
function openPartModal(id) { openPartForm(state.parts.find(p => p.id === id)); }

function openPartForm(p) {
  const isNew = !p;
  const title = isNew ? 'Новая запчасть' : 'Запчасть: ' + p.name;
  const pCats = p?.category_ids || [];
  const presetCat = isNew && state.whCat && state.whCat !== '__none__' ? state.whCat : null;
  const fixedCat = isNew && state.whCat && state.whCat !== '__none__' ? state.categories.find(c => c.id === state.whCat) : null;

  let html = `
    <label>Название</label><input id="p_name" value="${esc(p?.name || '')}">
    <label>В наличии</label><input id="p_stock" type="number" min="0" value="${p?.in_stock ?? 0}">
    <label>Ориентировочная цена, ₽ (за штуку)</label>
    <input id="p_price" type="number" min="0" value="${p?.price_unit ?? 0}">
    <label>Заказано (едет)</label><input id="p_ordered" type="number" min="0" value="${p?.ordered ?? 0}">
    <label>Заметки</label><textarea id="p_notes">${esc(p?.notes || '')}</textarea>
    <label>Ссылки на магазины</label>
    <div id="linksBox"></div>
    ${!isNew ? `<button class="btn secondary small" id="addLinkBtn" style="margin-top:4px">+ Добавить ссылку</button>` : '<div class="sub" style="color:#999;font-size:12px;margin-top:4px">Можно добавить после сохранения</div>'}`;

  if (isNew) {
    if (fixedCat) {
      html += `<label>Категория</label><div class="fixed-cat">Запчасть будет привязана к: <strong>${esc(fixedCat.name)}</strong></div>`;
    } else {
      html += `<label>Категория</label><div class="fixed-cat">Без категории (универсальная) — можно изменить после сохранения</div>`;
    }
  } else {
    const catNames = pCats.map(id => state.categories.find(c => c.id === id)?.name).filter(Boolean);
    const catText = catNames.length ? catNames.join(', ') : 'Универсальная (без категории)';
    html += `<label>Категория</label>
      <div class="cat-view">
        <span class="val">${esc(catText)}</span>
        <button class="btn small secondary" id="changeCatBtn">Изменить</button>
      </div>`;
  }

  if (!isNew) {
    html += `<div style="margin-top:18px;border-top:1px solid #e5e7eb;padding-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>Заказы запчасти</strong>
        <button class="btn small" id="newOrderBtn">+ Заказать</button>
      </div>
      <div id="ordersList" style="margin-top:8px"></div>
    </div>`;
  }

  html += `<div class="modal-actions">
    ${!isNew ? '<button class="btn danger" id="delBtn">Удалить</button>' : ''}
    <button class="btn secondary" id="cancelBtn">Отмена</button>
    <button class="btn" id="saveBtn">Сохранить</button></div>`;

  openModal(title, html, () => {
    $('#cancelBtn').onclick = () => closeModal();
    const changeBtn = $('#changeCatBtn');
    if (changeBtn) changeBtn.onclick = () => openCategoryPickerForPart(p.id);

    if (!isNew) {
      renderLinks(p.id);
      renderPartOrders(p.id);
      $('#addLinkBtn').onclick = async () => {
        const label = prompt('Название магазина (например, Ozon):');
        if (!label?.trim()) return;
        const url = prompt('Ссылка (URL):');
        if (!url?.trim()) return;
        let cleanUrl = url.trim();
        if (!/^https?:\/\//i.test(cleanUrl)) cleanUrl = 'https://' + cleanUrl;
        const { error } = await sb.from('part_links').insert({part_id: p.id, label: label.trim(), url: cleanUrl});
        if (error) { alert('Ошибка: ' + error.message); return; }
        await loadAll(); renderLinks(p.id);
      };
      $('#newOrderBtn').onclick = () => openOrderForm(p);
    }

    $('#saveBtn').onclick = async () => {
      const obj = {
        name: $('#p_name').value.trim(),
        in_stock: Math.max(0, parseInt($('#p_stock').value) || 0),
        price_unit: Math.max(0, parseInt($('#p_price').value) || 0),
        ordered: Math.max(0, parseInt($('#p_ordered').value) || 0),
        notes: $('#p_notes').value.trim()
      };
      if (isNew) obj.category_ids = presetCat ? [presetCat] : [];
      if (!obj.name) { alert('Введи название'); return; }
      if (isNew) {
        const { data, error } = await sb.from('parts').insert(obj).select().single();
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('add_part', `Добавил запчасть «${obj.name}» на склад (${obj.in_stock} шт)`, 'part', data.id);
        await loadAll(); closeModal(); openPartModal(data.id); render();
      } else {
        const { error } = await sb.from('parts').update(obj).eq('id', p.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('edit_part', `Изменил запчасть «${obj.name}»`, 'part', p.id);
        await loadAll(); render(); closeModal();
      }
    };

    if (!isNew) {
      $('#delBtn').onclick = async () => {
        const inRepairs = state.repairParts.filter(rp => rp.part_id === p.id);
        if (inRepairs.length) { alert(`Нельзя удалить: запчасть используется в ${inRepairs.length} записи ремонтов.`); return; }
        if (!confirm('Удалить запчасть со склада?')) return;
        const { error } = await sb.from('parts').delete().eq('id', p.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('del_part', `Удалил запчасть «${p.name}» со склада`, 'part', p.id);
        await loadAll(); render(); closeModal();
      };
    }
  });
}

  const current = part.category_ids || [];
  let html = `<div class="cat-list" id="catPickList">
    ${state.categories.map(c => `<label class="cat-item" style="cursor:pointer"><span class="cat-label"><input type="checkbox" value="${c.id}" ${current.includes(c.id)?'checked':''}><span>${esc(c.name)}</span></span></label>`).join('') || '<div style="color:#999;padding:6px">Категорий пока нет</div>'}

function renderLinks(partId) {

    <a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}</span><span>↗</span></a>

function openOrderForm(p) {
  const links = state.links.filter(l => l.part_id === p.id);
  const linkOpts = links.map(l => `<option value="${esc(l.label)}||${esc(l.url)}">${esc(l.label)}</option>`).join('');

    <div id="manualShop" style="${links.length ? 'display:none' : ''}"><input id="o_shop_manual" placeholder="Название магазина" style="margin-top:6px"></div>
    <label>Количество</label>
    <div class="qty-row"><button class="btn secondary" id="oMinus">−</button><input id="o_qty" type="number" value="1" min="1"><button class="btn secondary" id="oPlus">+</button></div>
    <label>Цена за штуку, ₽</label><input id="o_price" type="number" min="0" value="${defaultPrice}">
    <label>Заметки</label><textarea id="o_notes"></textarea>
    <div class="modal-actions"><button class="btn secondary" id="oCancel">Отмена</button><button class="btn" id="oConfirm">Заказать</button></div>`;
  openModal('Заказать: ' + p.name, html, () => {
    $('#oMinus').onclick = () => { const i = $('#o_qty'); i.value = Math.max(1, (+i.value||1) - 1); };
    $('#oPlus').onclick  = () => { const i = $('#o_qty'); i.value = (+i.value||1) + 1; };
    if (links.length) $('#o_shop').onchange = e => { $('#manualShop').style.display = e.target.value === '__manual__' ? 'block' : 'none'; };
    $('#oCancel').onclick = () => closeModal(true);
    $('#oConfirm').onclick = async () => {
      let shopLabel = '', shopUrl = '';
      if (links.length) {
        const v = $('#o_shop').value;
        if (v === '__manual__') shopLabel = $('#o_shop_manual').value.trim();
        else { const [lbl, url] = v.split('||'); shopLabel = lbl; shopUrl = url; }
      } else shopLabel = $('#o_shop_manual').value.trim();
      const qty = Math.max(1, parseInt($('#o_qty').value) || 1);
      const price = Math.max(0, parseInt($('#o_price').value) || 0);
      await sb.from('orders').insert({ part_id: p.id, part_name: p.name, shop_label: shopLabel, shop_url: shopUrl, qty, price, total: qty * price, status: 'ordered', employee_id: state.emp.id, employee_name: state.emp.name, notes: $('#o_notes').value.trim() });
      await sb.from('parts').update({ordered: (p.ordered||0) + qty}).eq('id', p.id);
      await addLog('order', `Заказал «${p.name}» (${qty} шт × ${money(price)})${shopLabel ? ', ' + shopLabel : ''}`, 'part', p.id);
      await loadAll(); closeModal(true); closeModal(); openPartModal(p.id); render();
    };
  }, true);
}

function openPickupDialog(partId) {
  const p = state.parts.find(x => x.id === partId);
  if (!p) return;
  const activeOrders = state.orders.filter(o => o.part_id === p.id && o.status === 'ordered');
  let html = `<label>Сколько пришло?</label>
    <div class="qty-row"><button class="btn secondary" id="pkMinus">−</button><input id="pk_qty" type="number" value="${p.ordered}" min="1" max="${p.ordered}"><button class="btn secondary" id="pkPlus">+</button></div>
    <div class="sub" style="color:#888;font-size:12px;margin-top:6px">Заказано: ${p.ordered} шт</div>
    <label>Цена за штуку, ₽</label><input id="pk_price" type="number" min="0" value="${p.price_unit || 0}">
    <label>Заметки</label><textarea id="pk_notes"></textarea>
    <div class="modal-actions"><button class="btn secondary" id="pkCancel">Отмена</button><button class="btn success" id="pkConfirm">Забрал</button></div>`;
  openModal('Забрал: ' + p.name, html, () => {
    $('#pkMinus').onclick = () => { const i = $('#pk_qty'); i.value = Math.max(1, (+i.value||1) - 1); };
    $('#pkPlus').onclick  = () => { const i = $('#pk_qty'); i.value = Math.min(p.ordered, (+i.value||1) + 1); };
    $('#pkCancel').onclick = () => closeModal();
    $('#pkConfirm').onclick = async () => {
      const qty = Math.max(1, Math.min(p.ordered, parseInt($('#pk_qty').value) || 1));
      const price = Math.max(0, parseInt($('#pk_price').value) || 0);
      const notes = $('#pk_notes').value.trim();
      const nowIso = new Date().toISOString();
      let remaining = qty;
      const sortedOrders = activeOrders.slice().sort((a,b) => new Date(a.ordered_at) - new Date(b.ordered_at));
      for (const o of sortedOrders) {
        if (remaining <= 0) break;
        if (o.qty <= remaining) {
          await sb.from('orders').update({ status: 'bought', bought_at: nowIso, price, total: o.qty * price, notes: notes || o.notes }).eq('id', o.id);
          remaining -= o.qty;
        } else {
          await sb.from('orders').update({ status: 'bought', bought_at: nowIso, price, total: remaining * price, notes: notes || o.notes, qty: remaining }).eq('id', o.id);
          await sb.from('orders').insert({ part_id: p.id, part_name: p.name, shop_label: o.shop_label, shop_url: o.shop_url, qty: o.qty - remaining, price: o.price, total: (o.qty - remaining) * o.price, status: 'ordered', employee_id: state.emp.id, employee_name: state.emp.name });
          remaining = 0;
        }
      }
      await sb.from('parts').update({ in_stock: (p.in_stock||0) + qty, ordered: Math.max(0, (p.ordered||0) - qty) }).eq('id', p.id);
      await addLog('pickup', `Забрал «${p.name}» — ${qty} шт, ${money(qty*price)}`, 'part', p.id);
      await loadAll(); render();
      closeModal();
    };
  });
}

    <label>Цена, ₽</label>
    <input id="t_price" type="number" min="0" value="${t?.price ?? 0}">
    <label>Магазин</label>
    <input id="t_shop" value="${esc(t?.shop || '')}" placeholder="Например: Ozon">
    <label>Ссылка на товар</label>
    <input id="t_url" value="${esc(t?.url || '')}" placeholder="https://...">
    <label>Заметки</label>
    <textarea id="t_notes">${esc(t?.notes || '')}</textarea>
  `;

  html += `<div class="modal-actions">
    ${!isNew ? '<button class="btn danger" id="delBtn">Удалить</button>' : ''}
    <button class="btn secondary" id="cancelBtn">Отмена</button>
    <button class="btn" id="saveBtn">Сохранить</button></div>`;

  openModal(title, html, () => {
    $('#cancelBtn').onclick = () => closeModal();
    $('#saveBtn').onclick = async () => {
      const name = $('#t_name').value.trim();
      if (!name) { alert('Введи название'); return; }
      const obj = {
        name,
        purchase_date: $('#t_date').value || today,
        price: Math.max(0, parseInt($('#t_price').value) || 0),
        shop: $('#t_shop').value.trim(),
        url: $('#t_url').value.trim(),
        notes: $('#t_notes').value.trim()
      };
      if (isNew) {
        obj.employee_id = state.emp.id;
        obj.employee_name = state.emp.name;
        const { data, error } = await sb.from('tools').insert(obj).select().single();
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('add_tool', `Добавил инструмент: ${name}`, 'tool', data.id);
      } else {
        const { error } = await sb.from('tools').update(obj).eq('id', t.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('edit_tool', `Изменил инструмент: ${name}`, 'tool', t.id);
      }
      await loadAll(); render(); closeModal();
    };
    if (!isNew) {
      $('#delBtn').onclick = async () => {
        if (!confirm(`Удалить инструмент «${t.name}»?`)) return;
        const { error } = await sb.from('tools').delete().eq('id', t.id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await addLog('del_tool', `Удалил инструмент: ${t.name}`, 'tool', t.id);
        await loadAll(); render(); closeModal();
      };
    }
  });
}

async function startApp() {
  $('#loginScreen').style.display = 'none';
  $('#app').style.display = 'block';
  await loadAll();
  render();
  subscribeRealtime();
}

let rt = false;
function subscribeRealtime() {
  if (rt) return; rt = true;
  const reload = async () => { await loadAll(); render(); };
  sb.channel('db')
    .on('postgres_changes', {event:'*', schema:'public', table:'techs'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'parts'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'categories'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'part_links'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'repairs'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'repair_parts'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'orders'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'tools'}, reload)
    .on('postgres_changes', {event:'*', schema:'public', table:'logs'}, reload)
    .subscribe();
}

$('#loginBtn').onclick = tryLogin;
$('#passwordInput').onkeydown = e => { if (e.key === 'Enter') tryLogin(); };
$('#loginInput').onkeydown   = e => { if (e.key === 'Enter') $('#passwordInput').focus(); };
$('#logoutBtn').onclick = () => { if (confirm('Выйти?')) logout(); };

$('#backBtn').onclick = () => {
  if (state.view === 'garage') state.garageCat = null;
  if (state.view === 'warehouse') state.whCat = null;
  state.search = '';
  render();
};

$('#addBtn').onclick = () => {
  if (state.view === 'garage') {
    if (!state.garageCat) openCategoryForm(null);
    else addTech();
  }
  else if (state.view === 'warehouse') {
    if (state.whTab === 'parts' && state.whCat) addPart();
    else if (state.whTab === 'tools') addTool();
  }
};

$$('nav button').forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  state.search = '';
  state.garageCat = null;
  state.whCat = null;
  render();
});

(async function init() {
  const saved = localStorage.getItem('rental_employee');
  if (saved) {
    try { state.emp = JSON.parse(saved); await startApp(); return; } catch(e) {}
  }
  $('#loginScreen').style.display = 'flex';
})();
</script>
</body>
